jenkins:
  systemMessage: "quant-pricing-engine Jenkins controller - configured as code."
  numExecutors: 0
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "${JENKINS_ADMIN_ID}"
            permissions:
              - "Overall/Administer"
  nodes:
    - permanent:
        name: "ci"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 1
        mode: EXCLUSIVE
        labelString: "ci"
        launcher:
          inbound:
            webSocket: true
            workDirSettings:
              disabled: false
              failIfWorkDirIsMissing: false
              internalDir: "remoting"

unclassified:
  location:
    url: "${JENKINS_URL}"
  gitHubConfiguration:
    apiRateLimitChecker: ThrottleOnOver

jobs:
  - script: >
      pipelineJob('quant-pricing-engine') {
        description('Managed by Jenkins Configuration as Code. Manual baseline job for the development branch.')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/5tench/quant-pricing-engine.git')
                }
                branch('*/development')
              }
            }
            scriptPath('ci/Jenkinsfile')
            lightweight()
          }
        }
      }
  - script: >
      multibranchPipelineJob('quant-pricing-engine-branches') {
        description('Managed by Jenkins Configuration as Code. Discovers GitHub branches and pull requests every thirty minutes.')
        branchSources {
          github {
            id('quant-pricing-engine-github')
            scanCredentialsId('')
            repoOwner('5tench')
            repository('quant-pricing-engine')
            buildOriginBranch(true)
            buildOriginBranchWithPR(false)
            buildOriginPRMerge(true)
            buildOriginPRHead(false)
            buildForkPRMerge(false)
            buildForkPRHead(false)
          }
        }
        configure { project ->
          project / factory / scriptPath('ci/Jenkinsfile')
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(20)
          }
        }
        triggers {
          periodicFolderTrigger {
            interval('30m')
          }
        }
      }
